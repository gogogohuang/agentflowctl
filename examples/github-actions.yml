# 在 issue 加上 flow 標籤時，由 claude 與 codex 輪流完成並開 PR。
# 放到 .github/workflows/flow.yml；在 repo secrets 設定兩家的 API key。
# 注意：CI 無法使用訂閱登入，這個範例會產生 API 費用，
# 專案的 flow.config.json 需設定 "auth": "api"，否則 agentflowctl 會移除這些 API key。
name: flow
on:
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  flow:
    if: github.event.label.name == 'flow'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 安裝 agent CLI 與 agentflowctl
        run: |
          npm install -g @anthropic-ai/claude-code @openai/codex
          npm install -g ./tools/agentflowctl   # 或從你發布的位置安裝
      - name: 執行 flow
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CODEX_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          git config user.name "agentflowctl"
          git config user.email "agentflowctl@users.noreply.github.com"
          printf '%s\n\n%s\n' "$ISSUE_TITLE" "$ISSUE_BODY" > /tmp/req.md
          agentflowctl run --req-file /tmp/req.md --budget 10 --cycle claude,codex
      - name: 保存紀錄
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentflowctl-runs
          path: .agentflowctl/runs/
