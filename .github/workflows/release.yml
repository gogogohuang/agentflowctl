# 推送 v* tag 時發布到 npm，例如：
#   npm version patch   # 更新 package.json 版本並建立 v0.1.1 tag
#   git push --follow-tags
#
# 使用 npm Trusted Publishing（OIDC），不需要 NPM_TOKEN；
# 需先在 npmjs.com 的套件設定中把這個 repo 與 release.yml 加為 Trusted Publisher。
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # 建立 GitHub Release
  id-token: write # npm Trusted Publishing 與 provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: 確認 tag 與 package.json 版本一致
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME 與 package.json 的版本 $version 不一致"
            exit 1
          fi
      - run: npm install -g npm@latest # Trusted Publishing 需要 npm 11.5.1 以上
      - run: pnpm install --frozen-lockfile
      # prepublishOnly 會再跑 typecheck、test、build
      - run: npm publish --provenance --access public
      - name: 建立 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
